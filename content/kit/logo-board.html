<!doctype html>
<!-- Drip logo board (drip_guide logo/house-style). ONE postable image per logo: 1600 x 1200, render at scale 2.
     The system comes from single-image brand boards that work (Sinline, Roamify, Seture, Session):
     a brand-tint ground, 80 margin, 40 gap, radius 32, 7 tiles, palette colours only, type 19-80px.
     Re-skin it: set every CHANGE ME. Keep the rules: flat fills only (no gradients, glow, foil, texture),
     nothing behind the mark or a sentence but a solid colour, nothing under 19px. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CHANGE ME brand board</title>
<!-- CHANGE ME: the brand's display + text faces -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    /* CHANGE ME: the palette (solid hexes only) */
    --ground: #C9DBF5;   /* the board: a light tint of the main colour */
    --tint:   #DCE8F8;   /* construction and device tiles */
    --main:   #4F8FE0;   /* the mark's body on light, the icon square, the launch screen */
    --light:  #9CC4F5;   /* the mark's body on dark, the print tile */
    --accent: #F2C46D;   /* the idea's part of the mark (ring, door...), one tagline word */
    --dark:   #16202F;   /* lockup + tagline tiles, wordmark ink */
    --white:  #FFFFFF;
    --display: "Instrument Serif", Georgia, serif;   /* CHANGE ME */
    --display-weight: 400;                            /* CHANGE ME */
    --display-track: -0.02em;
    --text: "IBM Plex Sans", system-ui, sans-serif;  /* CHANGE ME */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 1200px; overflow: hidden; background: var(--ground); }
  body { font-family: var(--text); color: var(--dark); -webkit-font-smoothing: antialiased; }
  .t { position: absolute; border-radius: 32px; overflow: hidden; isolation: isolate; }
  .disp { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--display-track); line-height: 1; }
  /* the mark: one <symbol>, coloured per tile with --body / --acc (flat) */
  .mk { display: block; height: auto; }
  .lockup { display: flex; align-items: flex-end; gap: 30px; }
  .lockup .word { font-family: var(--display); font-weight: var(--display-weight); letter-spacing: var(--display-track); line-height: .8; }

  /* 1 construction 520x590 */
  .con { left: 80px; top: 80px; width: 520px; height: 590px; background: var(--tint); display: grid; place-items: center; }
  .con .mk { width: 400px; margin-top: -40px; --body: var(--white); --acc: var(--accent); }
  .con .cap { position: absolute; left: 44px; bottom: 40px; font-size: 22px; opacity: .75; }
  /* 2 device 520x410 */
  .dev { left: 80px; top: 710px; width: 520px; height: 410px; background: var(--tint); }
  .dev img { position: absolute; left: 70px; top: 40px; width: 440px; transform: rotate(-8deg); transform-origin: top left; filter: drop-shadow(0 24px 30px rgba(10,16,40,.22)); }
  /* 3 primary lockup 606x282 */
  .logo { left: 640px; top: 80px; width: 606px; height: 282px; background: var(--dark); display: grid; place-items: center; color: var(--white); }
  .logo .mk { width: 160px; --body: var(--light); --acc: var(--accent); }
  .logo .word { font-size: 110px; }
  /* 4 palette 234x282 */
  .pal { left: 1286px; top: 80px; width: 234px; height: 282px; background: var(--white); display: flex; flex-direction: column; justify-content: center; gap: 12px; padding-left: 36px; }
  .pal .row { display: flex; align-items: center; gap: 14px; }
  .pal i { width: 64px; height: 64px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(10,20,50,.08); }
  .pal span { font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
  /* 5 app icon 420x358 */
  .ico { left: 640px; top: 402px; width: 420px; height: 358px; background: var(--white); display: grid; place-items: center; }
  .icon { width: 190px; height: 190px; border-radius: 44px; background: var(--main); display: grid; place-items: center; box-shadow: 0 18px 40px rgba(10,20,50,.16); }
  .icon .mk { width: 72%; --body: var(--white); --acc: var(--accent); }
  /* 6 print 420x358 */
  .prn { left: 1100px; top: 402px; width: 420px; height: 358px; background: var(--light); }
  .prn img { position: absolute; left: -40px; top: -10px; width: 520px; filter: drop-shadow(0 22px 22px rgba(10,16,40,.3)); }
  /* 7 tagline 880x320 */
  .tag { left: 640px; top: 800px; width: 880px; height: 320px; background: var(--dark); color: var(--white); padding: 56px 60px; }
  .tag .disp { font-size: 80px; position: relative; }
  .tag em { color: var(--accent); }
  .tag .url { position: absolute; left: 60px; bottom: 44px; font-size: 26px; font-weight: 500; }
  .tag .mk { position: absolute; right: -140px; top: 30px; width: 620px; --body: color-mix(in srgb, var(--white) 8%, var(--dark)); --acc: var(--accent); }
</style>
</head>
<body>
<!-- CHANGE ME: the mark, once. Solid fills only: the body uses var(--body), the idea's part var(--acc).
     Keep every <use> x/y/width/height equal to this viewBox (34 62 188 130 here) or the mark shifts.
     viewBox = the mark's own box. This placeholder is a cloud of circles under a ring. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="34 62 188 130">
    <path style="fill:var(--body)" d="M55 187A17.1 17.1 0 1 1 59.7 153.5A27.9 27.9 0 0 1 94.1 132.1A45 45 0 0 1 181.8 131.9A27.9 27.9 0 1 1 188 187Z"/>
    <path style="fill:var(--acc)" d="M67.8 121.8A73 73 0 0 1 208.3 122.5A41.9 41.9 0 0 0 191.6 117.4A59 59 0 0 0 84.4 117.3A41.9 41.9 0 0 0 67.8 121.8Z"/>
  </symbol>
</svg>

<section class="t con">
  <svg class="mk" viewBox="34 62 188 130"><use href="#mark" x="34" y="62" width="188" height="130"/>
    <!-- CHANGE ME: the construction in the mark's coordinates: its circles, baseline and path nodes -->
    <g fill="none" stroke="var(--main)" stroke-width=".6">
      <line x1="20" y1="187" x2="236" y2="187"/>
      <circle cx="55" cy="169.9" r="17.1"/><circle cx="87" cy="159.1" r="27.9"/><circle cx="138" cy="142" r="45"/><circle cx="188" cy="159.1" r="27.9"/>
    </g>
    <g fill="var(--main)"><rect x="52.4" y="184.4" width="5.2" height="5.2"/><rect x="185.4" y="184.4" width="5.2" height="5.2"/></g>
  </svg>
  <span class="cap">CHANGE ME: the construction in one line.</span>
</section>

<!-- CHANGE ME: a phone render with the flat launch screen (mockup_render, background transparent) -->
<section class="t dev"><img src="CHANGE-ME-phone.png" alt=""></section>

<!-- CHANGE ME: replace the <span class="word"> with the outlined wordmark SVG (logo_outline) before posting -->
<section class="t logo"><div class="lockup"><svg class="mk" viewBox="34 62 188 130"><use href="#mark" x="34" y="62" width="188" height="130"/></svg><span class="word">name</span></div></section>

<section class="t pal">
  <div class="row"><i style="background:var(--accent)"></i><span>#F2C46D</span></div>
  <div class="row"><i style="background:var(--main)"></i><span>#4F8FE0</span></div>
  <div class="row"><i style="background:var(--dark)"></i><span>#16202F</span></div>
</section>

<section class="t ico"><div class="icon"><svg class="mk" viewBox="34 62 188 130"><use href="#mark" x="34" y="62" width="188" height="130"/></svg></div></section>

<!-- CHANGE ME: business cards from flat card art (blender_render, background transparent) -->
<section class="t prn"><img src="CHANGE-ME-cards.png" alt=""></section>

<section class="t tag">
  <svg class="mk" viewBox="44 56 117 81" aria-hidden="true"><use href="#mark" x="34" y="62" width="188" height="130"/></svg>
  <p class="disp">CHANGE ME: the line,<br>one word in <em>accent.</em></p>
  <span class="url">CHANGE ME.com</span>
</section>
</body>
</html>
