<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film</title>
<!--
  Drip Motion launch film: the default composition (drip_guide video/house-style). A working 20 s film on a beat grid,
  built to be re-skinned, not to be kept as it is: replace every CHANGE ME with the brand's type, colours, copy and real
  product cards (images of the product's own screens, or rebuilt HTML with real content).

  The contract: one paused GSAP timeline `tl`; every frame is a pure function of its time, so motion_frames and the
  renderers seek exactly. No setTimeout/setInterval/Date.now/Math.random, no CSS animations or transitions, no network
  in the final render (copy gsap.min.js and the fonts next to this file). Preview: open it; space plays, arrows step a
  frame, ?t=3.2 opens at a time.

  The house rules this engine encodes (each one was asked for after a film missed it):
  - Time is in beats, B(n): set BPM from the track (motion_music analyse). Something new lands on almost every beat.
  - Words rise out of a mask, one per beat, in one plain colour. No blur-ins, no glows, no coloured highlight words.
  - Cards fly through 3D depth around the words, never across them; the world turns slowly the whole film.
  - A click is a cursor that travels in, presses, and the UI CHANGES STATE (a chip becomes selected, a badge appears).
    Never a selection box snapping around things, never a card jolting.
  - One motif (here the brand box: frame, handles, fill) is drawn live, carries the middle, and becomes the logo.
  - The lockup lands and holds still: no scale push on the end card.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  /* CHANGE ME: the brand. Fonts: load them (fonts_search, or a local fonts.css) and keep one display family. */
  :root {
    --ground: #0D0E12;       /* the field */
    --ink: #F5F2EC;          /* type and light cards */
    --accent: #2340FF;       /* the one brand colour: the box, the selected state, the full-frame field */
    --frame: #93A2FF;        /* hairlines on the ground */
    --muted: #8A8F9C;
    --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    --text: "Inter", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--text); transform-origin: 0 0; }
  .abs { position: absolute; }
  #grid { left: -200px; top: -200px; width: 2400px; height: 1500px; background-image: radial-gradient(circle, rgba(255,255,255,.09) 1.6px, transparent 1.9px); background-size: 44px 44px; }
  #field { left: 0; top: 0; width: 1920px; height: 1080px; background: var(--accent); opacity: 0; }
  #scene { left: 0; top: 0; width: 1920px; height: 1080px; perspective: 1500px; }
  #rig { left: 960px; top: 540px; transform-style: preserve-3d; }
  #world { left: 0; top: 0; transform-style: preserve-3d; }

  /* cards: CHANGE ME to the product's real screens (an <img> of each, or HTML with real content) */
  .cd { position: absolute; left: 0; top: 0; border-radius: 30px; overflow: hidden; background: #F3F2EE; color: #14161C;
        box-shadow: 0 40px 90px -30px rgba(0,0,0,.55); backface-visibility: hidden; box-sizing: border-box; padding: 34px 36px; font: 500 26px/1.3 var(--text); }
  .cd b { display: block; font-weight: 700; font-size: 30px; margin-bottom: 18px; }
  .cd.dark { background: #16181F; color: var(--ink); }
  .cd.brand { background: var(--accent); color: #fff; }
  .bar { height: 16px; border-radius: 8px; background: rgba(0,0,0,.12); margin: 12px 0; }
  .dark .bar, .brand .bar { background: rgba(255,255,255,.22); }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
  .chip { padding: 14px 24px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 2px #E2E0DA; font: 500 26px/1 var(--text); color: #14161C; white-space: nowrap; display: inline-flex; gap: 10px; align-items: center; }
  .chip svg { width: 0; height: 24px; overflow: visible; }
  .badge { position: absolute; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: #fff; font: 700 26px/1 var(--text); white-space: nowrap; }
  /* the "same page every agent ships": the problem the film pushes against (CHANGE ME to the category's generic look) */
  .tpl { position: absolute; left: 0; top: 0; width: 520px; height: 330px; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6); }
  .tpl .h { height: 210px; background: #D6D2CA; display: flex; align-items: center; justify-content: center; font: 700 30px/1.1 var(--text); color: #555; }
  .tpl .r { display: flex; gap: 14px; padding: 20px; } .tpl .r div { flex: 1; height: 80px; border-radius: 12px; background: #ECEAE6; }

  /* type: one family, one plain colour, words rise out of a mask */
  .words { left: 0; width: 1920px; text-align: center; font: 800 124px/1 var(--display); letter-spacing: -.03em; color: var(--ink); white-space: nowrap; z-index: 20; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .06em .02em .16em; margin: -.06em .1em -.16em; }
  .wi { display: inline-block; }
  .big { font-size: 190px; letter-spacing: -.045em; }
  .side { left: 1010px; width: 860px; font: 800 136px/.98 var(--display); letter-spacing: -.035em; color: #fff; z-index: 20; }
  .side .w { margin: -.06em .16em -.16em 0; }
  #headline { left: 300px; top: 330px; font: 800 168px/.96 var(--display); letter-spacing: -.04em; color: #fff; white-space: nowrap; z-index: 3; }
  #headline .w { margin: -.06em .14em -.16em 0; }
  svg.layer { position: absolute; left: 0; top: 0; overflow: visible; }
  #cur { left: 0; top: 0; width: 68px; height: 68px; z-index: 31; opacity: 0; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); }
  #logo { left: 0; width: 1920px; top: 420px; text-align: center; font: 800 220px/1 var(--display); letter-spacing: -.05em; color: var(--ink); }
  #tag { left: 0; width: 1920px; top: 720px; text-align: center; font: 700 64px/1 var(--display); letter-spacing: -.03em; color: var(--ink); }
  #pills { left: 0; width: 1920px; top: 830px; display: flex; justify-content: center; gap: 16px; }
  .pill { padding: 16px 30px; border-radius: 999px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); color: var(--ink); font: 600 32px/1 var(--text); white-space: nowrap; }

  #ui { position: fixed; left: 16px; right: 16px; bottom: 14px; display: none; gap: 12px; align-items: center; font: 12px/1 ui-monospace, monospace; color: #ddd;
        background: rgba(20,20,22,.82); padding: 10px 12px; border-radius: 10px; z-index: 100; }
  #ui input { flex: 1; } #ui button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 6px; background: #333; }
  html[data-live] #ui { display: flex; } html[data-rendering] #ui { display: none; }
</style>
</head>
<body>
<!-- Keep data-duration, data-width and data-height equal to FORMAT below. -->
<div id="stage" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
  <div class="abs" id="grid" data-camera></div>
  <div class="abs" id="field"></div>
  <div class="abs" id="scene"><div class="abs" id="rig" data-camera><div class="abs" id="world"></div></div></div>

  <!-- the motif: a box drawn live (frame, eight handles, fill). CHANGE ME to the brand's own shape. -->
  <div class="abs" id="box" style="left:0;top:0;width:1920px;height:1080px;transform-origin:960px 500px" data-track="box">
    <svg class="layer" width="1920" height="1080"><rect id="fill" fill="currentColor" style="color:var(--accent)"/><rect id="frame" fill="none" stroke-width="3" style="stroke:var(--frame)"/><g id="handles"></g></svg>
    <div class="abs" id="headline"><div><span class="w"><span class="wi">Taste</span></span><span class="w"><span class="wi">for</span></span><span class="w"><span class="wi">your</span></span></div><div><span class="w"><span class="wi">coding</span></span><span class="w"><span class="wi">agent.</span></span></div></div>
  </div>

  <!-- CHANGE ME: the film's one sentence, in fragments, one word per beat -->
  <div class="abs words" id="w1" style="top:478px" data-track="w1"><span class="w"><span class="wi">Your</span></span><span class="w"><span class="wi">agent</span></span><span class="w"><span class="wi">writes</span></span><span class="w"><span class="wi">the</span></span><span class="w"><span class="wi">code.</span></span></div>
  <div class="abs words" id="w2" style="top:458px" data-track="w2"><span class="w"><span class="wi">But</span></span><span class="w"><span class="wi">the</span></span><span class="w big"><span class="wi">design?</span></span></div>
  <div class="abs words" id="w3" style="top:478px" data-track="w3"><span class="w"><span class="wi">Same</span></span><span class="w"><span class="wi">page.</span></span><span class="w"><span class="wi">Every</span></span><span class="w"><span class="wi">time.</span></span></div>
  <div class="abs side" id="w4" style="top:360px;left:1130px;width:740px" data-track="w4"><span class="w"><span class="wi">It</span></span><span class="w"><span class="wi">asks</span></span><br><span class="w"><span class="wi">first.</span></span></div>
  <div class="abs words" id="w5" style="top:430px" data-track="w5"><span class="w big"><span class="wi">3,700+</span></span><span class="w"><span class="wi">components.</span></span></div>
  <div class="abs" id="logo" data-track="logo">brand</div>
  <div class="abs" id="tag">The line the film was saying.</div>
  <div class="abs" id="pills"><span class="pill">Works with</span><span class="pill">Every</span><span class="pill">Real</span><span class="pill">Name</span></div>

  <svg class="abs" id="cur" viewBox="0 0 40 40" data-track="cursor"><path d="M6 3 L6 33 L13.5 26 L18.5 37 L23.5 35 L18.5 24.5 L28.5 24.5 Z" fill="#0D0E12" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
</div>
<div id="ui"><button id="play">play</button><input id="scrub" type="range" min="0" step="0.001" value="0"><span id="time">0:00.00</span></div>

<script>
// ---- format and the beat grid (CHANGE ME: BPM from motion_music analyse; start the track on a downbeat) ----
const FORMAT = { width: 1920, height: 1080, fps: 30, duration: 20 };
const BPM = 120, b = 60 / BPM, B = (n) => +(n * b).toFixed(3);
const $ = (s) => document.querySelector(s), $$ = (s) => document.querySelectorAll(s);
const NS = "http://www.w3.org/2000/svg";
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261127);
// A closed-form spring: exact at any time. bounce 0 for type and UI, 0.15-0.3 for handles and badges.
function spring({ bounce = 0.15 } = {}) {
  const z = Math.min(1, Math.max(0.05, 1 - bounce * 1.6)), w = 6.9 / z, wd = w * Math.sqrt(1 - z * z);
  return (p) => (p >= 1 ? 1 : 1 - Math.exp(-z * w * p) * (Math.cos(wd * p) + ((z * w) / wd) * Math.sin(wd * p)));
}
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
const world = $("#world");

// ---- building blocks ----
// A card in the 3D world. CHANGE ME: html of the product's real screen, or `<img src="cards/x.png">` for a real capture.
function card(html, w, h, cls = "") {
  const d = document.createElement("div"); d.className = `cd ${cls}`; d.style.width = w + "px"; d.style.height = h + "px"; d.innerHTML = html;
  world.appendChild(d); gsap.set(d, { xPercent: -50, yPercent: -50, opacity: 0 }); return d;
}
const lines = (n) => Array.from({ length: n }, (_, i) => `<div class="bar" style="width:${60 + ((i * 37) % 35)}%"></div>`).join("");
function template() { const d = document.createElement("div"); d.className = "tpl"; d.innerHTML = `<div class="h">Your headline here</div><div class="r"><div></div><div></div><div></div></div>`;
  world.appendChild(d); gsap.set(d, { xPercent: -50, yPercent: -50, opacity: 0 }); return d; }
// A card flies through depth: always outside the text band (keep |y| above ~300 or |x| above ~700 while words are up).
function fly(el, t, dur, from, to) {
  tl.fromTo(el, { x: from.x, y: from.y, z: from.z, rotationY: from.ry || 0, rotationZ: from.rz || 0, opacity: t < 0.05 ? 1 : 0 },
    { x: to.x, y: to.y, z: to.z, rotationY: to.ry || 0, rotationZ: to.rz || 0, duration: dur, ease: to.ease || "power1.in" }, t)
    .to(el, { opacity: 1, duration: t < 0.05 ? 0.01 : 0.2, ease: "none" }, t)
    .to(el, { opacity: 0, duration: 0.15, ease: "none" }, t + dur - 0.15)
    .set(el, { display: "none" }, t + dur + 0.02);
}
// Words: each rises out of its mask on its beat (hidden until then, so nothing peeks); the line leaves upward.
function words(sel, beats, outBeat) {
  const ws = $$(sel + " .wi"); gsap.set(ws, { yPercent: 130, autoAlpha: 0 });
  ws.forEach((w, i) => tl.set(w, { autoAlpha: 1 }, B(beats[i])).to(w, { yPercent: 0, duration: 0.38, ease: "power4.out" }, B(beats[i])));
  if (outBeat != null) tl.to(ws, { yPercent: -130, duration: 0.24, ease: "power3.in", stagger: 0.02 }, B(outBeat)).set(ws, { autoAlpha: 0 }, B(outBeat) + 0.24 + 0.02 * ws.length);
}
// A click: the cursor travels in, presses, and leaves; pair it with a STATE CHANGE in the UI at the same time.
function click(x, y, t, fromX, fromY) {
  tl.set("#cur", { x: fromX, y: fromY }, t - 0.62).to("#cur", { opacity: 1, duration: 0.1 }, t - 0.6)
    .to("#cur", { x: x - 8, y: y - 6, duration: 0.5, ease: "power3.inOut" }, t - 0.6)
    .to("#cur", { scale: 0.86, duration: 0.07 }, t - 0.06).to("#cur", { scale: 1, duration: 0.12 }, t + 0.02)
    .to("#cur", { opacity: 0, x: x + 60, y: y + 80, duration: 0.3, ease: "power2.in" }, t + 0.9);
}

// ---- the motif box: drawn from P every frame ----
const P = { x: 960, y: 500, w: 0, h: 0, fA: 0, fill: 0, h0: 0, h1: 0, h2: 0, h3: 0, h4: 0, h5: 0, h6: 0, h7: 0 };
const hg = $("#handles"), HS = 24;
for (let i = 0; i < 8; i++) { const r = document.createElementNS(NS, "rect"); r.setAttribute("rx", 5); r.setAttribute("fill", "#fff"); r.setAttribute("stroke-width", 4); r.style.stroke = "var(--accent)"; hg.appendChild(r); }
const handles = [...hg.children], fillEl = $("#fill"), frameEl = $("#frame");
function render() {
  fillEl.setAttribute("x", P.x); fillEl.setAttribute("y", P.y); fillEl.setAttribute("width", Math.max(0, P.w)); fillEl.setAttribute("height", Math.max(0, P.h * P.fill));
  frameEl.setAttribute("x", P.x); frameEl.setAttribute("y", P.y); frameEl.setAttribute("width", Math.max(0, P.w)); frameEl.setAttribute("height", Math.max(0, P.h)); frameEl.setAttribute("opacity", P.fA);
  [[0,0],[.5,0],[1,0],[0,.5],[1,.5],[0,1],[.5,1],[1,1]].forEach(([u, v], i) => { const s = P["h" + i], sz = HS * s, r = handles[i];
    r.setAttribute("x", P.x + P.w * u - sz / 2); r.setAttribute("y", P.y + P.h * v - sz / 2); r.setAttribute("width", Math.max(0, sz)); r.setAttribute("height", Math.max(0, sz)); r.setAttribute("opacity", s > 0.01 ? 1 : 0); });
}
tl.eventCallback("onUpdate", render);
const handlesIn = (t) => { for (let i = 0; i < 8; i++) tl.to(P, { ["h" + i]: 1, duration: 0.28, ease: spring({ bounce: 0.25 }) }, t + i * 0.025); };

// ---- always alive: the ground drifts and the 3D world turns for the whole film ----
tl.fromTo("#grid", { x: 0, y: 0 }, { x: -170, y: -60, duration: FORMAT.duration, ease: "none" }, 0)
  .fromTo("#rig", { rotationY: -7, rotationX: 3 }, { rotationY: 7, rotationX: -2, duration: FORMAT.duration, ease: "sine.inOut" }, 0);

// ===== 1 · beats 0-6 · the hook: words land one per beat while real cards fly past (something on screen at frame 0) =====
words("#w1", [0.02, 1, 2, 3, 4], 5.4);
fly(card(`<b>Real screen one</b>${lines(4)}`, 900, 400), 0, B(6.2), { x: -560, y: -440, z: -900, ry: 18 }, { x: -900, y: -560, z: 700, ry: 26 });
fly(card(`<b>Real screen two</b>${lines(5)}`, 560, 420, "brand"), 0, B(5.8), { x: 640, y: 430, z: -1000, ry: -18 }, { x: 960, y: 560, z: 700, ry: -26 });
fly(card(`<b>Real screen three</b>${lines(3)}`, 520, 360), B(1), B(5.5), { x: 700, y: -440, z: -2400, ry: -16 }, { x: 980, y: -560, z: 650, ry: -24 });
fly(card(`<b>Real screen four</b>${lines(3)}`, 520, 360, "dark"), B(2), B(4.8), { x: -720, y: 440, z: -2400, ry: 18 }, { x: -980, y: 580, z: 650, ry: 26 });

// ===== 2 · beats 6-12 · the problem: the generic look bursts past, around the words =====
words("#w2", [6, 6.5, 7], 8.6);
[[-560, -330], [580, 320], [-600, 340], [600, -330], [-200, -420], [220, 430], [-820, -280], [840, 300]].forEach(([x, y], i) =>
  fly(template(), B(8.6) + i * 0.17, 1.15, { x: x * 1.5, y: y * 1.5, z: -2600, rz: i % 2 ? 5 : -5 }, { x: x * 2, y: y * 2, z: 600, rz: i % 2 ? 10 : -10, ease: "power2.in" }));
words("#w3", [9, 9.5, 10, 10.5], 11.6);

// ===== 3 · beats 12-20 · the motif is drawn live, the headline lands in it, the camera dives into the brand colour =====
tl.set(P, { x: 960, y: 500, w: 0, h: 0, fA: 1 }, B(12) - 0.02)
  .to(P, { x: 210, w: 1500, duration: 0.36, ease: "expo.out" }, B(12))
  .to(P, { y: 270, h: 470, duration: 0.36, ease: "expo.out" }, B(12) + 0.18);
handlesIn(B(12.5));
tl.to(P, { fill: 1, duration: 0.45, ease: "power2.inOut" }, B(13));
const hw = $$("#headline .wi"); gsap.set(hw, { yPercent: 130, autoAlpha: 0 });
hw.forEach((w, i) => tl.set(w, { autoAlpha: 1 }, B(14 + i * 0.5)).to(w, { yPercent: 0, duration: 0.38, ease: "power4.out" }, B(14 + i * 0.5)));
tl.to("#box", { scale: 10, duration: 0.62, ease: "power2.in" }, B(18.75))
  .set("#field", { opacity: 1 }, B(20) - 0.03).set("#box", { opacity: 0 }, B(20)).set("#grid", { opacity: 0 }, B(20));

// ===== 4 · beats 20-28 · the product doing the job: a click that changes state =====
const ask = card(`<b>How should it feel?</b><div class="chips"><span class="chip" id="pickChip"><svg viewBox="0 0 24 24"><path id="pickTick" d="M4 13 L10 19 L21 6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Calm and exact</span></span><span class="chip">Loud</span><span class="chip">Editorial</span><span class="chip">Playful</span></div>`, 900, 420);
tl.fromTo(ask, { x: -380, y: 420, z: -700, rotationX: 36, opacity: 0 }, { x: -380, y: 0, z: 0, rotationX: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, B(20) - 0.04)
  .to(ask, { z: 70, duration: B(6), ease: "sine.inOut" }, B(20.5))
  .to(ask, { x: -1900, rotationY: -45, z: -200, duration: 0.42, ease: "power3.in" }, B(27.3))
  .set(ask, { display: "none" }, B(28) + 0.05);
words("#w4", [20.5, 21.5, 22.5], 27.2);
// the chip sits at about (box left + 36, box top + 120) in the card; the cursor clicks it and it becomes selected
click(960 - 380 - 450 + 36 + 130, 540 - 210 + 34 + 30 + 26 + 50 + 4, B(24), 900, 1000);
tl.to("#pickChip", { backgroundColor: "#2340FF", color: "#ffffff", boxShadow: "inset 0 0 0 2px rgba(0,0,0,0)", duration: 0.14 }, B(24))
  .to("#pickChip svg", { width: 24, duration: 0.18 }, B(24))
  .fromTo("#pickTick", { strokeDasharray: 30, strokeDashoffset: 30 }, { strokeDashoffset: 0, duration: 0.22 }, B(24) + 0.04);
tl.to("#field", { opacity: 0, duration: 0.22, ease: "power2.in" }, B(28) - 0.1).set("#grid", { opacity: 1 }, B(28) - 0.1);

// ===== 5 · beats 28-34 · proof: a field of real cards around one real number (never an invented one) =====
[[-560, -360], [660, -330], [-720, 330], [720, 340], [-240, 420], [300, -430]].forEach(([x, y], i) => {
  const c = card(`<b>Real proof ${i + 1}</b>${lines(3)}`, 460, 300, i % 3 === 1 ? "brand" : ""), t = B(28) - 0.1 + i * b * 0.4;
  tl.fromTo(c, { x: x * 1.6, y: y * 1.6, z: -1600, rotationY: x < 0 ? 30 : -30, opacity: 0 }, { x, y, z: -300, rotationY: x < 0 ? 16 : -16, opacity: 1, duration: 0.7, ease: "expo.out" }, t)
    .to(c, { z: 120, x: x * 1.1, y: y * 1.1, rotationY: x < 0 ? 8 : -8, duration: Math.max(0.2, B(34) - t - 0.9), ease: "none" }, t + 0.7)
    .to(c, { z: 900, x: x * 1.9, y: y * 1.9, opacity: 0, duration: 0.35, ease: "power2.in" }, B(34) - 0.2)
    .set(c, { display: "none" }, B(34) + 0.2);
});
words("#w5", [28.5, 29], 33.4);

// ===== 6 · beats 34-40 · the motif becomes the logo; the lockup lands and holds still =====
tl.set(P, { x: 160, y: 130, w: 1600, h: 820, fill: 0, fA: 0, h0: 0, h1: 0, h2: 0, h3: 0, h4: 0, h5: 0, h6: 0, h7: 0 }, B(33.9))
  .set("#box", { opacity: 1, scale: 1 }, B(33.9)).set("#headline", { display: "none" }, B(33.9))
  .to(P, { fA: 1, duration: 0.12 }, B(34));
handlesIn(B(34));
tl.to(P, { x: 860, y: 230, w: 200, h: 200, duration: 0.6, ease: "power3.inOut" }, B(35) - 0.1)
  .to(P, { fill: 1, duration: 0.35, ease: "power2.inOut" }, B(35.5))
  .to(P, { y: 170, duration: 0.5, ease: "power3.inOut" }, B(36.5))
  .fromTo("#logo", { opacity: 1, clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.5, ease: "power4.out" }, B(36.5))
  .fromTo("#tag", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4 }, B(37.2));
$$(".pill").forEach((p, i) => tl.fromTo(p, { opacity: 0, y: 24, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: spring({ bounce: 0.2 }) }, B(38 + i * 0.5)));
gsap.set(["#tag", ".pill"], { opacity: 0 }); gsap.set("#logo", { clipPath: "inset(0 0 100% 0)" });
tl.to({}, { duration: 0.01 }, FORMAT.duration - 0.01);

// ---- fit the stage to the window (1:1 in a render) ----
const stage = $("#stage"), W = FORMAT.width, H = FORMAT.height;
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`; }
addEventListener("resize", fit); fit();

// ---- the contracts renderers seek through ----
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
const imgs = [...document.images].map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = i.onerror = r; })));
const ready = Promise.all([document.fonts ? document.fonts.ready : null, ...imgs]);
function show(t) { tl.seek(Math.min(Math.max(0, t), FORMAT.duration), false); render(); }
window.__drip = { ...FORMAT, async seek(t) { document.documentElement.dataset.rendering = "1"; playing = false; await ready; if (window.__dripWait) await Promise.all(window.__dripWait); show(t); } };
render();

// ---- preview: play, scrub, step ----
const scrub = $("#scrub"), time = $("#time"), playBtn = $("#play"); scrub.max = FORMAT.duration;
let now = 0, playing = false, loop = true, last = 0;
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, "0")}`;
function set(t) { now = Math.min(Math.max(0, t), FORMAT.duration); show(now); scrub.value = now; time.textContent = `${fmt(now)} / ${fmt(FORMAT.duration)}`; }
function frame(ts) { if (!playing) return; const dt = last ? (ts - last) / 1000 : 0; last = ts; let t = now + dt; if (t >= FORMAT.duration) { if (loop) t = 0; else { t = FORMAT.duration; playing = false; } } set(t); requestAnimationFrame(frame); }
function toggle() { playing = !playing; playBtn.textContent = playing ? "pause" : "play"; last = 0; if (playing) requestAnimationFrame(frame); }
playBtn.onclick = toggle; scrub.oninput = () => { playing = false; set(+scrub.value); };
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); toggle(); } if (e.code === "ArrowRight") set(now + (e.shiftKey ? 1 : 1 / FORMAT.fps)); if (e.code === "ArrowLeft") set(now - (e.shiftKey ? 1 : 1 / FORMAT.fps)); if (e.code === "KeyL") loop = !loop; });
const live = () => { if (!document.documentElement.dataset.rendering) document.documentElement.dataset.live = "1"; };
addEventListener("mousemove", live, { once: true }); addEventListener("keydown", live, { once: true });
ready.then(() => set(+(new URLSearchParams(location.search).get("t") || 0)));
</script>
</body>
