<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Film</title>
<!--
  Drip Motion composition. One clock: every frame is a pure function of time, so Drip can seek to any
  moment (motion_frames) and render frame by frame (motion_render) with exactly what you see here.
  Rules: no setTimeout/setInterval/Date.now/performance.now/Math.random and no network fetches in the film; no CSS animations or transitions
  (put everything on `tl`); random numbers only from rand() (seeded). Fonts load before frame 0.
  Preview: open the file in a browser. Space plays, arrow keys step one frame (shift: one second),
  ?t=3.2 opens at a time, L loops. For the final render, copy gsap.min.js next to this file and point
  the script tag at it, so the render never depends on the network.
-->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<!-- Seekable visuals: light, depth, particles, numbers (drip_guide video/visuals). drip_kit copies it beside this file. -->
<script src="motion-visuals.js"></script>
<style>
  /* CHANGE ME: from the storyboard's look. */
  :root {
    --ground: #0d0d0f;
    --ink: #f3f1ec;
    --muted: #8a877f;
    --accent: #ff5b3a;
    --font-display: "Inter", system-ui, sans-serif;
    --font-text: "Inter", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0; overflow: hidden;
    background: var(--ground); color: var(--ink); font-family: var(--font-text);
    transform-origin: 0 0;
  }
  /* Film elements are positioned in stage pixels (the storyboard's format), never in vw/vh. */
  .abs { position: absolute; will-change: transform, opacity; }
  .title { font: 600 112px/0.95 var(--font-display); letter-spacing: -0.035em; }
  .line { font: 500 44px/1.15 var(--font-text); letter-spacing: -0.01em; }

  /* Preview controls: hidden until a person moves the mouse or presses a key, so no renderer ever draws them
     (Kinetograph and HyperFrames seek __timelines and never call seek() below). */
  #ui { position: fixed; left: 16px; right: 16px; bottom: 14px; display: none; gap: 12px; align-items: center;
        font: 12px/1 ui-monospace, monospace; color: #ddd; background: rgba(20,20,22,.82); padding: 10px 12px;
        border-radius: 10px; backdrop-filter: blur(8px); z-index: 10; }
  #ui input { flex: 1; accent-color: var(--accent); }
  #ui button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 6px; background: #333; }
  html[data-live] #ui { display: flex; }
  html[data-rendering] #ui { display: none; }
</style>
</head>
<body>
<!-- HyperFrames-style root: Kinetograph, FrameVelo, HyperFrames and Drip's own capture all read this file.
     Keep data-duration, data-width and data-height equal to FORMAT below. -->
<div id="stage" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <!-- CHANGE ME: the film. Keep the motif one element that survives and changes, not a new one per beat. -->
  <div class="abs" id="motif" style="left:0;top:0;width:160px;height:160px;border-radius:40px;background:var(--accent)"></div>
  <div class="abs title" id="t1" style="left:160px;top:420px">One idea.</div>
  <div class="abs line" id="t2" style="left:160px;top:560px;color:var(--muted)">Carried from the first frame to the last.</div>
</div>
<div id="ui"><button id="play">play</button><input id="scrub" type="range" min="0" step="0.001" value="0"><span id="time">0:00.00</span></div>

<script>
// ---- format (CHANGE ME: from the storyboard) ----
const FORMAT = { width: 1920, height: 1080, fps: 30, duration: 8 };

// ---- seeded randomness: the same film every render ----
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261126);

// ---- a closed-form spring as a GSAP ease: exact at any time, so seeking is safe ----
// bounce 0 = no overshoot (critically damped), 0.1-0.25 = a small, expensive-feeling overshoot. Ends at exactly 1.
function spring({ bounce = 0.12 } = {}) {
  const zeta = Math.min(1, Math.max(0.05, 1 - bounce * 1.6));
  const decay = 6.9; // e^-6.9 ≈ 0.001: settled by the end of the tween
  if (zeta >= 1) return (p) => (p >= 1 ? 1 : 1 - Math.exp(-9.2 * p) * (1 + 9.2 * p));
  const w = decay / zeta;
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return (p) => (p >= 1 ? 1 : 1 - Math.exp(-zeta * w * p) * (Math.cos(wd * p) + ((zeta * w) / wd) * Math.sin(wd * p)));
}

// ---- the master timeline: one clock for the whole film ----
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
const S = (sel) => document.querySelector(sel);
const W = FORMAT.width, H = FORMAT.height;

// CHANGE ME: one label per storyboard beat, at the storyboard's time.
tl.addLabel("hook", 0)
  // The motif arrives with weight: a short anticipation (squash) then a spring to its place.
  .fromTo("#motif", { x: W / 2 - 80, y: -200, scaleY: 1, scaleX: 1 }, { y: H / 2 - 80, duration: 0.9, ease: "power2.in" }, "hook")
  .to("#motif", { scaleY: 0.78, scaleX: 1.18, duration: 0.12, ease: "power1.out" }, "hook+=0.9")
  .to("#motif", { scaleY: 1, scaleX: 1, duration: 0.7, ease: spring({ bounce: 0.2 }) }, "hook+=1.02")
  .addLabel("turn", 2.4)
  // The same shape becomes the frame for the words: it moves, it isn't replaced.
  .to("#motif", { x: 160 - 40, y: 380, width: 1100, height: 300, borderRadius: 28, opacity: 0.16, duration: 1.1, ease: "expo.inOut" }, "turn")
  .from("#t1", { y: 40, opacity: 0, duration: 0.8 }, "turn+=0.55")
  .from("#t2", { y: 24, opacity: 0, duration: 0.7 }, "turn+=0.75")
  .addLabel("rest", 4.6)
  .to({}, { duration: FORMAT.duration - 4.6 }, "rest"); // hold to the end: rest is part of the rhythm

// ---- fit the stage to the window (1:1 in a render, where the viewport is the film's size) ----
const stage = S("#stage");
stage.style.width = W + "px";
stage.style.height = H + "px";
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * k) / 2}px, ${(innerHeight - H * k) / 2}px) scale(${k})`;
}
addEventListener("resize", fit);
fit();

// ---- the contracts renderers seek through ----
// HyperFrames / Kinetograph / FrameVelo: one paused root timeline registered by composition id.
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
// A living ground from frame 0: never a dead flat background (drip_guide video/visuals). Add every beat's own
// visuals to this list: glow, plane3d, lightSweep, particlesToShape, countUp...
if (window.DripVisuals) {
  const V = window.DripVisuals;
  V.drive(tl, [V.lightField(stage, { seed: 7, intensity: 0.7 }), V.grain(stage, { opacity: 0.06, seed: 3 })]);
}
// Drip's own capture (and anything that calls seek(t) directly).
let ready = document.fonts ? document.fonts.ready : Promise.resolve();
function show(t) {
  tl.seek(Math.min(Math.max(0, t), FORMAT.duration), false);
}
window.__drip = {
  ...FORMAT,
  async seek(t) {
    document.documentElement.dataset.rendering = "1";
    playing = false;
    await ready;
    show(t);
  },
};

// ---- preview: play, scrub, step ----
const scrub = S("#scrub"), time = S("#time"), playBtn = S("#play");
scrub.max = FORMAT.duration;
let now = 0, playing = false, loop = true, last = 0;
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, "0")}`;
function set(t) { now = Math.min(Math.max(0, t), FORMAT.duration); show(now); scrub.value = now; time.textContent = `${fmt(now)} / ${fmt(FORMAT.duration)}`; }
function frame(ts) {
  if (!playing) return;
  const dt = last ? (ts - last) / 1000 : 0; last = ts;
  let t = now + dt;
  if (t >= FORMAT.duration) { if (loop) t = 0; else { t = FORMAT.duration; playing = false; playBtn.textContent = "play"; } }
  set(t);
  requestAnimationFrame(frame);
}
function toggle() { playing = !playing; playBtn.textContent = playing ? "pause" : "play"; last = 0; if (playing) requestAnimationFrame(frame); }
playBtn.onclick = toggle;
scrub.oninput = () => { playing = false; playBtn.textContent = "play"; set(+scrub.value); };
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight") set(now + (e.shiftKey ? 1 : 1 / FORMAT.fps));
  if (e.code === "ArrowLeft") set(now - (e.shiftKey ? 1 : 1 / FORMAT.fps));
  if (e.code === "KeyL") loop = !loop;
});
// A person is here: show the controls (renderers never move a mouse or press a key).
const live = () => { if (!document.documentElement.dataset.rendering) document.documentElement.dataset.live = "1"; };
addEventListener("mousemove", live, { once: true });
addEventListener("keydown", live, { once: true });
ready.then(() => set(+(new URLSearchParams(location.search).get("t") || 0)));
</script>
</body>
</html>
