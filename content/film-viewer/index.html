<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drip Film</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A0B0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.6v12.8a1 1 0 0 0 1.52.86l10.4-6.4a1 1 0 0 0 0-1.72L9.52 4.74A1 1 0 0 0 8 5.6Z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="6.5" y="5" width="4" height="14" rx="1.2"/><rect fill="currentColor" x="13.5" y="5" width="4" height="14" rx="1.2"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 5h5v5M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5c3.6 4.3 7 8.3 7 12a7 7 0 0 1-14 0c0-3.7 3.4-7.7 7-12Z"/></symbol>
  <symbol id="i-cursor" viewBox="0 0 20 22"><path d="M2.2 1.6 17.4 10a.9.9 0 0 1-.12 1.64l-6.1 2.1-3.2 5.7a.9.9 0 0 1-1.64-.2L1.03 2.67a.9.9 0 0 1 1.17-1.07Z"/></symbol>
</svg>

<div class="app" id="app">
  <header class="top">
    <a class="brand" href="?" aria-label="Drip Film"><svg class="drop" aria-hidden="true"><use href="#i-drop"/></svg></a>
    <h1 class="title" id="title">Drip Film</h1>
    <button class="live" id="liveBtn" hidden aria-pressed="true"><i></i>Live</button>
  </header>

  <main class="stage" id="stage" aria-label="The build, played back">
    <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="intro" id="intro"></p>
    <p class="line" id="line" aria-live="polite"></p>
    <div class="who" id="who" aria-label="Working now"><span class="clock" id="realClock"></span></div>
    <div class="wall" id="wall"></div>

    <div class="win" id="win">
      <div class="bar"><i></i><i></i><i></i><span class="url" id="url"></span></div>
      <div class="view" id="view">
        <div class="paper" id="paper"></div>
        <img id="imgA" alt="" decoding="async">
        <img id="imgB" alt="" decoding="async">
        <div class="band" id="band"></div>
        <div class="marks" id="marks"></div>
        <div class="cursors" id="cursors"></div>
      </div>
    </div>
    <p class="note" id="note"></p>

    <div class="empty" id="empty" hidden><p id="emptyText">Waiting for the first moments of the run.</p></div>

    <div class="end" id="end" hidden>
      <div class="end-in">
        <svg class="end-drop" aria-hidden="true"><use href="#i-drop"/></svg>
        <p class="end-big" id="endBig">Built.</p>
        <p class="end-sub" id="endSub"></p>
        <div class="end-act">
          <button class="btn primary" id="replayBtn"><svg aria-hidden="true"><use href="#i-replay"/></svg>Replay</button>
          <a class="btn" id="openBtn" target="_blank" rel="noopener" hidden><svg aria-hidden="true"><use href="#i-out"/></svg>Open the page</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="transport" id="transport">
    <button class="play" id="playBtn" aria-label="Play"><svg class="i-play" aria-hidden="true"><use href="#i-play"/></svg><svg class="i-pause" aria-hidden="true"><use href="#i-pause"/></svg></button>
    <span class="time" id="time">00:00</span>
    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="track" id="track"></div>
      <div class="ticks" id="ticks"></div>
      <div class="knob" id="knob"></div>
      <div class="peek" id="peek"></div>
    </div>
    <span class="time dim" id="dur">00:00</span>
    <button class="speed" id="speedBtn" aria-label="Playback speed">1×</button>
  </footer>
</div>
<script src="model.js"></script>
<script src="viewer.js"></script>
</body>
</html>
