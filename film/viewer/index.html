<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drip Film</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="viewer.css">
<script>
  // theme before paint: ?theme= wins, then the saved choice, then the system
  (function () {
    var q = new URLSearchParams(location.search).get('theme'), s = null;
    try { s = localStorage.getItem('drip-film-theme'); } catch (e) {}
    var t = q || s || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
  })();
</script>
</head>
<body>
<div class="app" id="app" data-mode="live" data-tab="agents">

  <header class="top">
    <a class="brand" href="?" aria-label="Drip Film"><svg class="logo" viewBox="-50.425 -258.925 858.525 417.07500000000005" height="26" role="img" aria-label="Drip"><g transform="translate(0 -208.5) scale(0.43439999999999995)"><path d="M0,0 H480 V480 H448 A34,34 0 0 0 414,514 C414,601 419.9,624.7 419.9,672.1 A47.9,47.9 0 0 1 324.1,672.1 C324.1,624.7 330,601 330,514 A34,34 0 0 0 296,480 H294 A34,34 0 0 0 260,514 C260,526.8 260.8,530.2 260.8,537.2 A20.8,20.8 0 0 1 219.2,537.2 C219.2,530.2 220,526.8 220,514 A34,34 0 0 0 186,480 H178 A34,34 0 0 0 144,514 C144,563.2 148.5,576.7 148.5,603.5 A36.5,36.5 0 0 1 75.5,603.5 C75.5,576.7 80,563.2 80,514 A34,34 0 0 0 46,480 H0 Z" fill="#2340FF"/><path d="M0,0 H480 V480 H0 Z" fill="none" style="stroke:var(--frame)" stroke-width="8"/><rect x="-22" y="-22" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/><rect x="218" y="-22" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/><rect x="458" y="-22" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/><rect x="-22" y="218" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/><rect x="458" y="218" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/><rect x="-22" y="458" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/><rect x="458" y="458" width="44" height="44" rx="5" fill="#fff" stroke="#2340FF" stroke-width="8"/></g>
<path transform="translate(272.5 0)" d="M68.1 4.2L68.1 4.2Q51 4.2 37.4-5.0Q23.7-14.1 15.6-32.7Q7.5-51.3 7.5-80.1L7.5-80.1Q7.5-107.4 14.8-125.5Q22.2-143.7 35.4-152.7Q48.6-161.7 66.3-161.7L66.3-161.7Q80.7-161.7 91.5-155.7Q102.3-149.7 109.2-136.9Q116.1-124.2 118.8-104.1L118.8-104.1L121.5-104.1Q120-115.5 118.5-125.7Q117-135.9 116.3-145.2Q115.5-154.5 115.5-162.3L115.5-162.3L115.5-208.5L159-208.5L158.7-58.8L159 0L120.9 0L121.8-49.8L119.4-49.8Q116.1-32.1 109.2-19.9Q102.3-7.8 92.1-1.8Q81.9 4.2 68.1 4.2ZM82.2-30.9L82.2-30.9Q89.4-30.9 95.7-34.2Q102-37.5 106.3-43.8Q110.7-50.1 113.3-58.5Q115.8-66.9 115.8-77.1L115.8-77.1L115.8-79.2Q115.8-87.3 114.1-94.3Q112.5-101.4 109.5-107.1Q106.5-112.8 102.3-116.8Q98.1-120.9 93-123Q87.9-125.1 82.2-125.1L82.2-125.1Q72.3-125.1 65.3-118.6Q58.2-112.2 54.8-101.5Q51.3-90.9 51.3-77.4L51.3-77.4Q51.3-64.5 54.9-53.9Q58.5-43.2 65.4-37.0Q72.3-30.9 82.2-30.9ZM216 0L173.1 0L173.1-82.8L172.8-157.5L210.6-157.5L209.7-92.1L212.1-92.1Q213.9-117.6 219.3-132.8Q224.7-147.9 232.9-154.5Q241.2-161.1 251.7-161.1L251.7-161.1Q256.8-161.1 262.4-159.8Q267.9-158.4 273.6-155.4L273.6-155.4L271.2-107.7Q265.2-111 259.2-112.6Q253.2-114.3 248.1-114.3L248.1-114.3Q237.9-114.3 230.7-108Q223.5-101.7 219.8-89.5Q216-77.4 216-60L216-60L216 0ZM323.1 0L279.9 0L279.9-157.5L323.1-157.5L323.1 0ZM301.2-171L301.2-171Q288.6-171 282-176.4Q275.4-181.8 275.4-191.7L275.4-191.7Q275.4-201.9 282-207.3Q288.6-212.7 301.2-212.7L301.2-212.7Q313.8-212.7 320.6-207.3Q327.3-201.9 327.3-191.7L327.3-191.7Q327.3-181.8 320.6-176.4Q313.8-171 301.2-171ZM380.7 43.8L337.2 43.8L337.5-98.1L337.2-157.5L375.6-157.5L374.7-108L376.8-108Q380.4-126.3 387.3-138.3Q394.2-150.3 404.7-156Q415.2-161.7 429.3-161.7L429.3-161.7Q447.6-161.7 460.9-152.4Q474.3-143.1 481.3-124.8Q488.4-106.5 488.4-79.5L488.4-79.5Q488.4-50.7 480.6-32.3Q472.8-13.8 459.6-4.8Q446.4 4.2 429.6 4.2L429.6 4.2Q415.5 4.2 404.8-1.9Q394.2-8.1 387.4-20.4Q380.7-32.7 378.0-51L378.0-51L375.0-51Q376.8-41.1 378.0-31.3Q379.2-21.6 379.9-12.4Q380.7-3.3 380.7 5.1L380.7 5.1L380.7 43.8ZM413.7-31.8L413.7-31.8Q424.2-31.8 430.9-37.9Q437.7-44.1 441.1-54.8Q444.6-65.4 444.6-78L444.6-78Q444.6-91.2 441.0-101.7Q437.4-112.2 430.6-118.3Q423.9-124.5 414.0-124.5L414.0-124.5Q406.8-124.5 400.6-121.3Q394.5-118.2 390.0-112.3Q385.5-106.5 382.9-98.1Q380.4-89.7 380.4-78.9L380.4-78.9L380.4-76.8Q380.4-68.7 382.0-61.8Q383.7-54.9 386.7-49.4Q389.7-43.8 393.9-39.9Q398.1-36 403.2-33.9Q408.3-31.8 413.7-31.8Z" fill="currentColor"/></svg><span class="brand-film">Film</span></a>
    <span class="top-sep" aria-hidden="true"></span>
    <div class="task">
      <h1 class="task-title" id="taskTitle">Loading film…</h1>
      <div class="task-meta" id="taskMeta"></div>
    </div>
    <div class="top-right">
      <span class="status" id="status" data-state="idle"><i></i><span id="statusText"></span></span>
      <div class="seg" role="tablist" aria-label="View">
        <button role="tab" data-mode="live" aria-selected="true">Live</button>
        <button role="tab" data-mode="montage" aria-selected="false">Montage</button>
      </div>
      <button class="icon-btn" id="themeBtn" data-tip="Theme (T)" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Panels">
    <button role="tab" data-tab="agents" aria-selected="true">Agents <span class="count" id="tabAgentsCount"></span></button>
    <button role="tab" data-tab="feed" aria-selected="false">Activity <span class="count" id="tabFeedCount"></span></button>
  </div>

  <aside class="panel agents-panel" aria-label="Agents">
    <div class="panel-head">
      <h2>Agents</h2>
      <span class="panel-sub" id="agentsSub"></span>
    </div>
    <ol class="agents" id="agents"></ol>
  </aside>

  <section class="stage" aria-label="The page being built">
    <div class="frame-wrap">
    <div class="window" id="window">
      <div class="chrome">
        <span class="url" id="url"><span id="urlText"></span></span>
        <span class="frame-no" id="frameNo"></span>
      </div>
      <div class="screen" id="screen">
        <img id="imgA" alt="" decoding="async">
        <img id="imgB" alt="" decoding="async">
        <div class="empty" id="empty" hidden>
          <div class="empty-sk" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <p id="emptyText">Waiting for the first frame</p>
        </div>
        <div class="endcard" id="endcard" hidden>
          <div class="end-in">
            <p class="end-eyebrow">Built in</p>
            <p class="end-time" id="endTime"></p>
            <p class="end-sub" id="endSub"></p>
            <div class="end-models" id="endModels"></div>
            <div class="end-actions">
              <button class="btn" id="replayBtn"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.8 8a5.2 5.2 0 1 0 1.6-3.8M2.6 2.4v2.9h2.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Replay</button>
              <a class="btn ghost" id="openBtn" target="_blank" rel="noopener">Open the page<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M6 3.5h6.5V10M12.3 3.7 4 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></a>
            </div>
          </div>
        </div>
      </div>
      <div class="drips" aria-hidden="true">
        <svg class="drip d1" viewBox="46 478 140 164"><path d="M186,480 A34,34 0 0 0 144,514 C144,563.2 148.5,576.7 148.5,603.5 A36.5,36.5 0 0 1 75.5,603.5 C75.5,576.7 80,563.2 80,514 A34,34 0 0 0 46,480 Z"/></svg>
        <svg class="drip d2" viewBox="186 478 108 81"><path d="M294,480 A34,34 0 0 0 260,514 C260,526.8 260.8,530.2 260.8,537.2 A20.8,20.8 0 0 1 219.2,537.2 C219.2,530.2 220,526.8 220,514 A34,34 0 0 0 186,480 Z"/></svg>
        <svg class="drip d3" viewBox="296 478 152 243"><path d="M448,480 A34,34 0 0 0 414,514 C414,601 419.9,624.7 419.9,672.1 A47.9,47.9 0 0 1 324.1,672.1 C324.1,624.7 330,601 330,514 A34,34 0 0 0 296,480 Z"/><path class="glint" d="M351 560 V640"/></svg>
      </div>
      <span class="handles" aria-hidden="true"><i style="left:0;top:0"></i><i style="left:50%;top:0"></i><i style="left:100%;top:0"></i><i style="left:0;top:50%"></i><i style="left:100%;top:50%"></i><i style="left:0;top:100%"></i><i style="left:100%;top:100%"></i></span>
      <div class="caption" id="caption" hidden>
        <span class="cap-faces" id="capFaces"></span>
        <span class="cap-text" id="capText"></span>
        <span class="cap-time" id="capTime"></span>
      </div>
      <span class="frame-dims" id="frameDims"></span>
    </div>
    </div>
    <div class="transport" id="transport">
      <button class="icon-btn" id="prevBtn" data-tip="Previous frame (←)" aria-label="Previous frame"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 3v10M12.5 3.6v8.8L6 8z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      <button class="play" id="playBtn" aria-label="Play">
        <svg class="i-play" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5 3.2v9.6L13 8z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <svg class="i-pause" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="4" y="3" width="2.8" height="10" rx=".8" fill="currentColor"/><rect x="9.2" y="3" width="2.8" height="10" rx=".8" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" data-tip="Next frame (→)" aria-label="Next frame"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M12 3v10M3.5 3.6v8.8L10 8z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg></button>
      <span class="clock" id="clock">00:00 <span>/ 00:00</span></span>
      <div class="scrub" id="scrub" aria-hidden="true"><div class="scrub-fill" id="scrubFill"></div></div>
      <div class="seg small" id="speed" role="radiogroup" aria-label="Speed">
        <button data-speed="1" aria-checked="true" role="radio">1×</button>
        <button data-speed="2" aria-checked="false" role="radio">2×</button>
        <button data-speed="4" aria-checked="false" role="radio">4×</button>
      </div>
    </div>
    <div class="livebar" id="livebar">
      <span class="lb-item"><span class="lb-k">Elapsed</span><span class="lb-v mono" id="lbElapsed"></span></span>
      <span class="lb-item"><span class="lb-k">Working</span><span class="lb-v" id="lbWorking"></span></span>
      <span class="lb-item"><span class="lb-k">Files</span><span class="lb-v mono" id="lbFiles"></span></span>
      <span class="lb-item"><span class="lb-k">Frames</span><span class="lb-v mono" id="lbFrames"></span></span>
      <span class="lb-note" id="lbNote"></span>
    </div>
  </section>

  <aside class="panel feed-panel" aria-label="Activity">
    <div class="panel-head">
      <h2>Activity</h2>
      <span class="panel-sub" id="feedSub"></span>
    </div>
    <ol class="feed" id="feed"></ol>
  </aside>

  <section class="timeline" aria-label="Timeline">
    <div class="tl-head">
      <h2>Timeline</h2>
      <div class="summary" id="summary"></div>
    </div>
    <div class="tl-body" id="tlBody">
      <div class="tl-ruler" id="ruler"></div>
      <div class="tl-lanes" id="lanes"></div>
      <div class="playhead" id="playhead"><span class="ph-bubble" id="phBubble">00:00</span></div>
      <div class="tl-hover" id="tlHover" hidden></div>
    </div>
  </section>

  <div class="toast" id="toast" hidden>
    <span class="toast-dot"></span><span id="toastText">The build finished.</span>
    <button class="btn small" id="toastBtn">Watch the montage</button>
  </div>
  <div class="tip" id="tip" hidden></div>
</div>
<script src="viewer.js"></script>
</body>
</html>
