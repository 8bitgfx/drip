<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=block">
<style>
  html,body{margin:0;background:transparent}
  body.light{--ink:#16140F}
  body.dark{--ink:#F4F1EA}
  .wrap{display:inline-block;padding:40px 40px 60px 40px}
  .word{position:relative;font:400 360px/0.9 'Instrument Serif',serif;letter-spacing:-0.025em;color:var(--ink);white-space:nowrap}
  .drop{position:absolute;width:70px;height:108px}
</style></head>
<body class="light">
<div class="wrap" id="wrap"><div class="word" id="word">dr<span id="i">ı</span>p<svg class="drop" id="drop" viewBox="300 178 424 652" aria-hidden="true"><defs><radialGradient id="s" cx="38%" cy="34%" r="70%"><stop offset="0" stop-color="#FF6A45"/><stop offset=".6" stop-color="#E8452C"/><stop offset="1" stop-color="#C73A22"/></radialGradient></defs><path d="M512 178 C 560 300, 724 450, 724 610 C 724 734, 629 830, 512 830 C 395 830, 300 734, 300 610 C 300 450, 464 300, 512 178 Z" fill="url(#s)"/><path d="M392 640 C 380 560, 420 480, 468 420" stroke="#FFE1D8" stroke-opacity=".55" stroke-width="26" stroke-linecap="round" fill="none"/></svg></div></div>
<script>
  if (location.hash === '#dark') document.body.className = 'dark';
  document.fonts.ready.then(() => {
    const word = document.getElementById('word').getBoundingClientRect();
    const i = document.getElementById('i').getBoundingClientRect();
    const drop = document.getElementById('drop');
    // Centre the drop over the dotless i's stem; its bottom sits just above the x-height.
    const stemCenter = i.left - word.left + i.width * 0.5;
    // Sit the drop where a tittle sits: its bottom ~0.06em above the x-height.
    drop.style.left = (stemCenter - 35 - 7) + 'px';
    drop.style.top = (i.top - word.top + i.height * 0.115) + 'px';
    document.body.dataset.ready = '1';
  });
</script>
</body></html>
